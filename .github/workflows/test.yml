name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", django: "5.2", postgres: "16" }
          - { python: "3.13", django: "5.2", postgres: "16" }
          - { python: "3.12", django: "6.0", postgres: "16" }
          - { python: "3.13", django: "6.0", postgres: "16" }
          - { python: "3.14", django: "6.0", postgres: "16" }
          - { python: "3.12", django: "6.1", postgres: "16" }
          - { python: "3.13", django: "6.1", postgres: "16" }
          - { python: "3.14", django: "6.1", postgres: "16" }
          # The PostgreSQL 14 floor the README claims for Django 5.2 and 6.0; Django 6.1 enforces PostgreSQL 15 through its own minimum_database_version at connect time.
          - { python: "3.13", django: "5.2", postgres: "14" }
          - { python: "3.13", django: "6.0", postgres: "14" }

    name: py${{ matrix.python }} dj${{ matrix.django }} pg${{ matrix.postgres }}

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: ddm
          POSTGRES_PASSWORD: ddm
          POSTGRES_DB: ddm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: ddm
      PGUSER: ddm
      PGPASSWORD: ddm

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install with the pinned Django
        run: |
          uv sync
          uv pip install "django~=${{ matrix.django }}.0"

      # --no-sync on every uv run below is load-bearing, not tidiness. uv verifies the environment
      # against uv.lock before every `uv run` and reinstalls the locked Django, silently undoing the
      # pin above. Without it all nine cells test one Django version and the matrix proves nothing.
      - name: Assert the pinned Django is what will actually run
        run: |
          uv run --no-sync python -c "
          import django, sys
          print(sys.version)
          print(django.get_version())
          assert django.get_version().startswith('${{ matrix.django }}.'), f'expected Django ${{ matrix.django }}.x, got {django.get_version()}'
          "

      - name: Run the suite
        run: uv run --no-sync pytest -q

  # Installs the built wheel, not the source tree, and imports it from outside the checkout, so a package-data file missing from the wheel fails here rather than for users.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv "$RUNNER_TEMP/venv"
      - run: uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - name: Import the installed package and check its data files
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "
          import pathlib, deferred_migrations
          root = pathlib.Path(deferred_migrations.__file__).parent
          print(root)
          assert 'site-packages' in root.parts, root
          for name in ('skills/fixing-deploy-safety/SKILL.md', 'migrations/max_migration.txt'):
              assert (root / name).is_file(), f'{name} is missing from the wheel'
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # The commit-msg hook only runs where someone installed it. This enforces the same rules on
  # every commit in a pull request, including ones from contributors without pre-commit.
  # commitlint runs directly rather than through the pre-commit hook: that hook is
  # `commitlint --edit` with pass_filenames: false, so it ignores --commit-msg-filename and only
  # ever reads .git/COMMIT_EDITMSG. The major version matches what the hook installs (21).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Lint every commit message in the pull request
        run: npx --yes -p @commitlint/cli@21 -p @commitlint/config-angular@21 commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
