name: release

on:
  push:
    branches: [main]

# One release at a time; a second push waits rather than racing to tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      # Release from the exact commit the tests ran on, on a named branch PSR can commit to and push.
      - run: git checkout -B "${{ github.ref_name }}"

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Version, changelog, tag, push and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release -v version

      # Straight after the release step, and even if it failed: PSR writes released/tag on exit, so a
      # failure after the tag push (e.g. creating the GitHub release) still gets the build to PyPI.
      # A re-run cannot recover that state, as the pushed release commit fails PSR's upstream check.
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && steps.release.outputs.released == 'true' }}
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Attach the distributions to the GitHub release
        if: ${{ !cancelled() && steps.release.outputs.released == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release publish --tag "${{ steps.release.outputs.tag }}"

  publish:
    needs: release
    # Runs even when the release job failed after tagging, since the tag is already public by then.
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
