name: release

on:
  push:
    branches: [main]
  # A push that modifies .github/workflows starts no workflow run in this repository, so the merge
  # that lands a workflow change never dispatches the release. This input is the way to release from
  # such a commit, and the way to force a version the commits do not imply, 1.0.0 in particular:
  # --major bumps from the latest tag and so ignores major_on_zero.
  workflow_dispatch:
    inputs:
      force_level:
        description: Force a bump level instead of deriving it from the commits
        type: choice
        default: none
        options: [none, patch, minor, major]

# One release at a time; a second push waits rather than racing to tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The release app's installation token does the pushing, so the workflow token stays read-only.
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # The "Protect main" ruleset requires status checks and CodeQL results that a commit pushed
      # straight to main can never have, and [skip ci] means none will ever run on it, so PSR's
      # release commit needs a ruleset bypass actor. GITHUB_TOKEN cannot be one: a repository ruleset
      # only accepts an app installed on the owning organisation. Hence a dedicated app, whose
      # installation token carries contents: write on this repository alone and expires in an hour.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the installation token to the one permission PSR needs: pushing the release commit
          # and tag, and creating the GitHub release. Without this it inherits every permission the
          # app holds.
          permission-contents: write

      # Credentials persist because PSR pushes the release commit and tag. Only dist/ is uploaded as
      # an artifact, never the checkout, so the token in .git/config cannot leak through one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # zizmor: ignore[artipacked]
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      # Release from the exact commit the tests ran on, on a named branch PSR can commit to and push.
      - run: git checkout -B "$REF_NAME"
        env:
          REF_NAME: ${{ github.ref_name }}

      # The same uv as local development, so a uv upgrade cannot rewrite uv.lock inside the release commit.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.12.17"
          python-version: "3.12"

      - run: uv sync

      # FORCE_LEVEL is empty on a push, so a merge to main still derives the version from the commits.
      - name: Version, changelog, tag, push and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FORCE_LEVEL: ${{ inputs.force_level }}
        run: |
          if [ -n "$FORCE_LEVEL" ] && [ "$FORCE_LEVEL" != "none" ]; then
            uv run semantic-release -v version "--$FORCE_LEVEL"
          else
            uv run semantic-release -v version
          fi

      # Straight after the release step, and even if it failed: PSR writes released/tag on exit, so a
      # failure after the tag push (e.g. creating the GitHub release) still gets the build to PyPI.
      # A re-run cannot recover that state, as the pushed release commit fails PSR's upstream check.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.release.outputs.released == 'true' }}
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Attach the distributions to the GitHub release
        if: ${{ !cancelled() && steps.release.outputs.released == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: uv run semantic-release publish --tag "$TAG"

  publish:
    needs: release
    # Runs even when the release job failed after tagging, since the tag is already public by then.
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
